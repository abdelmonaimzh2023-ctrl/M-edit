<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>M-edit</title>
<link rel="stylesheet" href="css/glassmorphism.css">
<style>
  .home-container { display: flex; flex-direction: column; height: 100vh; }
  .header {
    padding: calc(env(safe-area-inset-top) + 10px) 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(10,10,14,.35);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
  }
  .projects-grid {
    flex: 1; padding: 16px;
    display: grid; grid-template-columns: repeat(2,1fr); gap: 12px;
    overflow-y: auto; align-content: start;
  }
  .project-card {
    border-radius: var(--r-lg); padding: 14px 10px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    text-align: center; color: var(--text-1); cursor: pointer;
    transition: transform .2s var(--ease), background .2s;
  }
  .project-card:active { transform: scale(.95); background: var(--glass-bg-strong); }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; color: var(--text-2); text-align: center;
  }
  .fab {
    position: fixed; bottom: 24px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent-blue); color: white; font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 25px rgba(10,132,255,.4); z-index: 30;
    transition: transform .2s var(--ease);
  }
  .fab:active { transform: scale(.9); }
</style>
</head>
<body>
<div class="home-container">
  <header class="header">
    <h1 style="font-size:20px; font-weight:700;">M-edit</h1>
    <span id="projectCount" style="font-size:13px; color:var(--text-2);">0 مشاريع</span>
  </header>
  <div class="projects-grid" id="projectsGrid">
    <div class="empty-state" id="emptyState">
      <div style="font-size:48px; margin-bottom:16px;">🎬</div>
      <p>لا توجد مشاريع بعد</p>
      <button class="btn-primary" style="margin-top:16px;" onclick="createNewProject()">مشروع جديد</button>
    </div>
  </div>
</div>
<button class="fab" onclick="createNewProject()">+</button>
<input type="file" id="hiddenFileInput" accept="video/*" style="display:none">

<script src="js/bridge.js"></script>
<script>
  let projects = JSON.parse(localStorage.getItem('m_edit_projects') || '[]');

  function saveProjects() {
    localStorage.setItem('m_edit_projects', JSON.stringify(projects));
  }

  function renderProjects() {
    const grid = document.getElementById('projectsGrid');
    grid.innerHTML = '';
    if (projects.length === 0) {
      grid.innerHTML = '<div class="empty-state" id="emptyState"><div style="font-size:48px; margin-bottom:16px;">🎬</div><p>لا توجد مشاريع بعد</p><button class="btn-primary" style="margin-top:16px;" onclick="createNewProject()">مشروع جديد</button></div>';
      document.getElementById('projectCount').textContent = '0 مشاريع';
      return;
    }
    projects.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `<strong>${p.name}</strong><br><small style="color:var(--text-3);">${p.date}</small>`;
      card.onclick = () => openProject(idx);
      grid.appendChild(card);
    });
    document.getElementById('projectCount').textContent = projects.length + ' مشاريع';
  }

  function createNewProject() {
    if (window.callNative) {
      callNative('openFilePicker', 'video');
    } else {
      document.getElementById('hiddenFileInput').click();
    }
  }

  function handleVideoFile(file) {
    const project = {
      id: Date.now(),
      name: file.name || 'مشروع جديد',
      date: new Date().toLocaleDateString('ar'),
      videoUri: URL.createObjectURL(file)
    };
    projects.unshift(project);
    saveProjects();
    renderProjects();
    sessionStorage.setItem('currentVideoUri', project.videoUri);
    sessionStorage.setItem('currentProjectId', project.id);
    window.location.href = 'editor.html';
  }

  document.getElementById('hiddenFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleVideoFile(file);
  });

  window.addEventListener('bridge:filePicked', (e) => {
    if (e.detail.type === 'video') {
      handleVideoFile({ name: 'فيديو مستورد', path: e.detail.path });
    }
  });

  function openProject(index) {
    const project = projects[index];
    sessionStorage.setItem('currentVideoUri', project.videoUri);
    sessionStorage.setItem('currentProjectId', project.id);
    window.location.href = 'editor.html';
  }

  renderProjects();
</script>
</body>
</html>
